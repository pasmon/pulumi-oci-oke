# Workload Identity enrollment for External Secrets Operator.
#
# Placeholders marked TODO are cluster specific. Fill them in from the
# `pulumi stack output oke_dynamic_group_id` and the ESO ServiceAccount, then
# commit. argo-apps/cluster/external-secrets.yaml references the
# ClusterSecretStore by name, so it stays cluster agnostic.
#
# Steps, in order:
#   1. Create the three OCI Vault secrets (radio-cloudflare-dns01,
#      radio-grafana-cloud, and any others the workloads need).
#   2. Create an OKE cluster API key and a DynamicGroup matching this SPIFFE ID:
#        spiffe://<cluster-ocid>/ns/external-secrets/sa/external-secrets
#   3. Attach that dynamic group to the policy exported as
#      `oke_dynamic_group_id` (Pulumi creates that dynamic group).
#   4. Paste the resulting annotation key onto the ServiceAccount below and
#      commit.
#
# The certificate bundle OCI requires is the cluster CA, published as the
# `kubeconfig-ca-cert` ConfigMap in every namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
spec:
  provider:
    oracle:
      vault: TODO_VAULT_OCID
      region: TODO_REGION
      principalType: Workload
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    # Replace with:
    #   identity.oci.authorization.oke.info/<oke-dynamic-group-ocid>:
    #     <spiffe-id-of-this-service-account>
    TODO_WORKLOAD_IDENTITY_ANNOTATION: TODO_WORKLOAD_IDENTITY_VALUE
