apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 8.3.3
    helm:
      releaseName: argocd
      values: |
        crds:
          install: true
        server:
          service:
            type: ClusterIP
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  # Automation is deliberately off. Two owners of one release does not work.
  #
  # To hand over, after the cluster is healthy:
  #   1. pulumi config set argocd-managed-by-pulumi false
  #   2. pulumi up          (destroys the Pulumi-managed Helm release)
  #   3. add automated: {prune: true, selfHeal: true} below and commit
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
